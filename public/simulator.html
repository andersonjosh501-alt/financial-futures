<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="See what investing a little every month can grow into.">
<title>Financial Futures Growth Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
/* Projector layout: a short input column on the left, the answer and chart filling the rest. Fits 1366x768. Answer goes first on phones. */
:root{
  --bg:#FBFCFA; --fg:#10241A; --muted:#506357; --rule:#D8E2D9; --field:#EFF4EE;
  --green:#1B5E20; --bright:#4CAF50; --fill:rgba(76,175,80,.32); --gold:#B8860B; --goldline:#B8860B; --late:#A33A2B; --onaccent:#FFFFFF;
  --display:"Fira Sans Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --body:"Fira Sans",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1910; --fg:#EAF2EC; --muted:#A3B8A9; --rule:#26392C; --field:#15261A;
  --green:#86D28F; --bright:#4CAF50; --fill:rgba(76,175,80,.38); --gold:#E2B33F; --goldline:#E2B33F; --late:#EE7A67; --onaccent:#0D1910; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1910; --fg:#EAF2EC; --muted:#A3B8A9; --rule:#26392C; --field:#15261A;
  --green:#86D28F; --bright:#4CAF50; --fill:rgba(76,175,80,.38); --gold:#E2B33F; --goldline:#E2B33F; --late:#EE7A67; --onaccent:#0D1910; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg);height:100%;margin:0}
body{font-family:var(--body);font-size:18px;line-height:1.35}
.wrap{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,20px);padding-block:clamp(12px,2.2vh,28px);padding-left:max(16px,min(48px,3.5vw),env(safe-area-inset-left,0px));padding-right:max(16px,min(48px,3.5vw),env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:16px}
header img{height:clamp(56px,8vh,90px);width:auto;flex:none}
.brand{font:800 clamp(1.15rem,1.7vw,1.7rem)/1 var(--display);color:var(--green);text-transform:uppercase;letter-spacing:.04em}
.brand span{color:var(--bright)}
a.brand{text-decoration:none;display:block}
h1{font:800 clamp(1.8rem,3.4vw,3.2rem)/1 var(--display);margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,clamp(320px,24vw,440px)) minmax(0,1fr);gap:clamp(20px,3vw,48px)}
.inputs{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--rule);padding-right:clamp(16px,2.4vw,40px);overflow:auto}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.presets button{font:600 clamp(.95rem,1.05vw,1.15rem) var(--body);padding:9px 10px;border-radius:6px;border:1px solid var(--rule);background:var(--field);color:var(--fg);cursor:pointer;text-align:center}
.presets button:hover{border-color:var(--bright)}
.presets button[aria-pressed="true"]{background:var(--bright);border-color:var(--bright);color:#0D1910}
.ctrl{display:grid;gap:2px;padding-block:clamp(5px,1vh,10px);border-top:1px solid var(--rule)}
.ctrl>label{font-weight:700;font-size:clamp(1.05rem,1.2vw,1.35rem)}
.row{display:flex;align-items:center;gap:14px}
.num{display:flex;align-items:baseline;gap:4px;width:7.2em;box-sizing:border-box;background:var(--field);border:1px solid var(--rule);border-radius:6px;padding:5px 10px;font-weight:700;font-size:clamp(1.05rem,1.2vw,1.3rem);flex:none}
.num span{color:var(--muted);font-weight:600}
.num input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);font:700 1em var(--body);font-variant-numeric:tabular-nums;text-align:right;padding:0}
.num:focus-within{outline:3px solid var(--goldline);outline-offset:1px}
.num input:focus{outline:none}
input[type=range]{flex:1;min-width:0;height:28px;accent-color:var(--green);-webkit-appearance:none;appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--green);margin-top:-10px;border:3px solid var(--bg)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--rule)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--green);border:3px solid var(--bg)}
input[type=range]:focus-visible,button:focus-visible,summary:focus-visible,.check input:focus-visible{outline:3px solid var(--goldline);outline-offset:2px}
details{border-top:1px solid var(--rule);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:1rem;padding-block:2px}
details .ctrl:first-of-type{border-top:0}
.check{display:flex;gap:12px;align-items:center;font-weight:600;font-size:1.02rem;padding-block:8px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--green);margin:0}
.answer{display:flex;flex-direction:column;min-width:0;min-height:0}
.results{display:flex;flex-wrap:wrap;gap:8px clamp(24px,4vw,64px);align-items:flex-start}
.res.later{border-left:2px solid var(--rule);padding-left:clamp(20px,3vw,48px)}
.res{min-width:0}
.lead{font-size:clamp(1.1rem,1.6vw,1.5rem);color:var(--muted);font-weight:600}
.big{overflow-wrap:anywhere;font:800 clamp(3rem,7.5vw,7.4rem)/.95 var(--display);color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:4px}
.res.later .big{color:var(--late);font-size:clamp(2.2rem,4.6vw,4.6rem)}
.split{font-size:clamp(1.1rem,1.6vw,1.55rem);margin:clamp(6px,1.2vh,12px) 0 0;max-width:62ch}
.split .in{color:var(--gold);font-weight:800}
.split .up{color:var(--green);font-weight:800}
.wait{font:800 clamp(1.4rem,2.6vw,2.5rem)/1.1 var(--display);margin:clamp(6px,1.2vh,12px) 0 0}
.wait b{color:var(--late)}
.chart{flex:1;min-height:220px;position:relative;margin-top:clamp(8px,1.6vh,18px)}
.chart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.note{font-size:clamp(.95rem,1.05vw,1.15rem);color:var(--muted);margin:6px 0 0}
@media (max-height:820px) and (min-width:901px){.ctrl{padding-block:3px}.presets{margin-bottom:2px}.presets button{padding:7px 8px}header img{height:52px}}
@media (max-width:900px){
  .wrap{height:auto;min-height:100%}
  .grid{grid-template-columns:1fr}
  .inputs{border-right:0;padding-right:0;overflow:visible}
  .answer{order:-1}
  .chart{flex:none;min-height:0;aspect-ratio:4/3.2}
}
</style>
</head>

const money=n=>{const v=Math.round(n);return (v<0?"-$":"$")+Math.abs(v).toLocaleString("en-US")};
const short=n=>{const a=Math.abs(n),sg=n<0?"-":"";
  if(a<1e4)return sg+"$"+Math.round(a).toLocaleString("en-US");
  for(const[d,l,f]of[[1e12,"T",2],[1e9,"B",2],[1e6,"M",2],[1e3,"K",0]]){
    const v=+(a/d).toFixed(f);
    if(v>=1&&(v<1000||l==="T"))return sg+"$"+v.toLocaleString("en-US")+l;
  }
  return sg+"$"+Math.round(a)};

// The yearly return is converted to its exact monthly equivalent, so 10% a year really is 10% a year.
// The lump sum lands at the start month after that month's interest; monthly deposits come at the end of each later month.
// In today's-dollars mode each amount is divided by 1.03^(years elapsed) at the moment it happens.
function simulate(start,monthly,rate,years,reinv,delayYears,infl){
  const r=Math.pow(1+rate/100,1/12)-1, keep=reinv/100, months=years*12, d=delayYears*12;
  const defl=m=>infl?Math.pow(1.03,m/12):1;
  let bal=0, contrib=0, contribN=0, paid=0; const pts=[];
  for(let m=0;m<=months;m++){
    if(m>0){
      const g=bal*r; bal+=g*keep; paid+=g*(1-keep)/defl(m);
      if(m>d){bal+=monthly;contrib+=monthly/defl(m);contribN+=monthly}
    }
    if(m===d){bal+=start;contrib+=start/defl(m);contribN+=start}
    if(m%12===0)pts.push({y:m/12,v:bal/defl(m),c:contrib});
  }
  return {bal:bal/defl(months),contrib,contribN,paid,pts};
}

function niceStep(max,target){const raw=max/target,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

function draw(main,late){
  const svg=$("chart"),box=svg.getBoundingClientRect();
  const W=Math.max(300,box.width),H=Math.max(200,box.height);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const fs=Math.max(15,Math.min(22,W/50));
  const yrs=main.pts.length-1, e=main.pts[yrs];
  const labs=[{t:short(e.v),v:e.v,c:"var(--green)"},{t:"Put in "+short(e.c),v:e.c,c:"var(--gold)"}];
  if(late)labs.push({t:"Age "+(F.age+F.delay)+": "+short(late.pts[yrs].v),v:late.pts[yrs].v,c:"var(--late)"});
  const lw=Math.max(...labs.map(l=>l.t.length))*fs*0.6+fs;
  const L=fs*3.6,R=Math.min(lw,W*.4),T=fs*0.9,B=fs*2;
  const all=main.pts.flatMap(p=>[p.v,p.c]).concat(late?late.pts.map(p=>p.v):[]);
  const maxV=Math.max(100,...all);
  let step=0,top=Infinity;for(const k of[4,5,6]){const st=niceStep(maxV,k),tp=Math.ceil(maxV/st)*st;if(tp<top-1e-9){top=tp;step=st}}
  const x=t=>L+(W-L-R)*t/yrs, y=v=>T+(H-T-B)*(1-v/top);
  let s="";
  for(let i=0;i*step<=top+step*1e-6;i++){const v=i*step;
    s+=`<line x1="${L}" x2="${x(yrs)}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/>`;
    s+=`<text x="${L-8}" y="${y(v)+fs*.35}" text-anchor="end" font-family="var(--body)" font-size="${fs}" fill="var(--muted)">${short(v)}</text>`;
  }
  const maxN=Math.max(2,Math.floor((W-L-R)/(fs*5.2)));
  const xs=[1,2,5,10,20,30].find(v=>yrs/v<=maxN)||30;
  const ageAt=t=>"Age "+(F.age+t);
  for(let t=0;t<=yrs;t+=xs){
    if(t!==0&&t!==yrs&&yrs%xs!==0&&x(yrs)-x(t)<fs*5.6)continue;
    s+=`<text x="${x(t)}" y="${H-fs*.45}" text-anchor="${t===0?"start":t===yrs?"end":"middle"}" font-family="var(--body)" font-size="${fs}" fill="var(--muted)">${ageAt(t)}</text>`;
  }
  if(yrs%xs!==0)s+=`<text x="${x(yrs)}" y="${H-fs*.45}" text-anchor="end" font-family="var(--body)" font-size="${fs}" fill="var(--muted)">${ageAt(yrs)}</text>`;
  const line=(pts,k)=>pts.map((p,i)=>`${i?"L":"M"}${x(p.y).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  s+=`<path d="${line(main.pts,"v")}L${x(yrs)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--fill)"/>`;
  s+=`<path d="${line(main.pts,"c")}" fill="none" stroke="var(--goldline)" stroke-width="3.5"/>`;
  if(late)s+=`<path d="${line(late.pts.slice(F.delay),"v")}" fill="none" stroke="var(--late)" stroke-width="3.5" stroke-dasharray="10 7"/>`;
  s+=`<path d="${line(main.pts,"v")}" fill="none" stroke="var(--green)" stroke-width="4.5" stroke-linejoin="round"/>`;
  s+=`<circle cx="${x(yrs)}" cy="${y(e.v)}" r="${fs*.38}" fill="var(--green)" stroke="var(--bg)" stroke-width="3"/>`;
  // Labels sit to the right of where the lines end, nudged apart vertically so they never touch.
  labs.forEach(l=>l.y=y(l.v)+fs*.35);
  labs.sort((a,b)=>a.y-b.y);
  const gap=fs*1.3;let prev=-1e9;
  labs.forEach(l=>{l.ly=Math.max(l.y,prev+gap,T+fs);prev=l.ly});
  for(let i=labs.length-1;i>=0;i--){const lim=i===labs.length-1?y(0)+fs*.35:labs[i+1].ly-gap;if(labs[i].ly>lim)labs[i].ly=lim}
  labs.forEach(l=>{s+=`<text x="${x(yrs)+fs*.7}" y="${l.ly}" font-family="var(--body)" font-weight="700" font-size="${fs*1.05}" fill="${l.c}">${l.t}</text>`});
  svg.innerHTML=s;
}

let lastM,lastL,activePreset=null;
function render(){
  const m=simulate(F.start,F.monthly,F.rate,F.years,F.reinv,0,F.infl);
  const endAge=F.age+F.years;
  const lateOn=F.delay>0&&F.delay<F.years;
  const both=F.start>0&&F.monthly>0;
  $("headline").textContent=lateOn?`Start at ${F.age} vs. start at ${F.age+F.delay}`:(both?`What ${money(F.start)} + ${money(F.monthly)} a month becomes`:F.monthly>0?`What ${money(F.monthly)} a month becomes`:`What ${money(F.start)} becomes`);
  $("lead").textContent=lateOn?`Start at ${F.age} and by ${endAge} you have`:`By age ${endAge} you'd have`+(F.infl?" (today's dollars)":"");
  const fv=money(m.bal);$("final").textContent=fv;
  const shrink=(el,txt)=>{el.style.fontSize=txt.length>12?`clamp(2.2rem,${(7.5*12/txt.length).toFixed(2)}vw,7.4rem)`:""};shrink($("final"),fv);
  const kept=Math.round(m.bal)-Math.round(m.contrib), earned=kept+Math.round(m.paid);
  let t=`You put in <span class="in">${money(m.contribN)}</span>`+(F.infl?` (worth ${money(m.contrib)} in today's dollars)`:"")+". ";
  if(F.reinv>=100)t+=kept>=0?`The market added <span class="up">${money(kept)}</span>.`:`Inflation ate <b>${money(-kept)}</b> of it.`;
  else if(F.reinv<=0)t+=`The market earned <span class="up">${money(earned)}</span>, and you spent all of it.`;
  else t+=`The market earned <span class="up">${money(earned)}</span>. You spent <b>${money(m.paid)}</b> and kept <b>${money(kept)}</b>.`;
  $("split").innerHTML=t;
  let late=null;const w=$("wait");
  if(lateOn){
    late=simulate(F.start,F.monthly,F.rate,F.years,F.reinv,F.delay,F.infl);
    $("leadLate").textContent=`Start at ${F.age+F.delay} and by ${endAge} you have`;
    $("finalLate").textContent=money(late.bal);
    $("laterBox").hidden=false;
    const cost=(Math.round(m.bal)+Math.round(m.paid))-(Math.round(late.bal)+Math.round(late.paid));
    w.innerHTML=`Waiting ${F.delay} year${F.delay==1?"":"s"} cost <b>${money(cost)}</b>.`;
    w.hidden=false;
  }else{
    $("laterBox").hidden=true;
    if(F.delay>=F.years){w.textContent="Pick a wait shorter than the years invested.";w.hidden=false}else w.hidden=true;
  }
  $("note").textContent=`Assumes a steady ${F.rate}% a year${F.infl?" and 3% inflation":""} (S&P 500 average since 1928 is about 10%). Real markets swing. Not financial advice.`;
  lastM=m;lastL=late;draw(m,late);
}
const fmt=k=>k==="rate"?String(F[k]):F[k].toLocaleString("en-US");
function sync(){keys.forEach(k=>{$(k).value=fmt(k);$(k+"R").value=F[k]});$("infl").checked=F.infl}
function clamp(k,v){const[a,b]=limits[k];let n=Math.min(b,Math.max(a,v));if(ints.includes(k))n=Math.round(n);return n}
function unpress(){document.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed","false"))}
keys.forEach(k=>{
  $(k).addEventListener("input",e=>{const n=parseFloat(e.target.value.replace(/[^0-9.]/g,""));if(isNaN(n))return;F[k]=clamp(k,n);$(k+"R").value=F[k];unpress();render()});
  $(k).addEventListener("change",()=>sync());
  $(k).addEventListener("blur",()=>sync());
  $(k+"R").addEventListener("input",e=>{F[k]=clamp(k,parseFloat(e.target.value));$(k).value=fmt(k);unpress();render()});
});
$("infl").addEventListener("change",e=>{F.infl=e.target.checked;unpress();render()});
document.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{Object.assign(F,presets[b.dataset.p]);sync();render();unpress();b.setAttribute("aria-pressed","true")}));
new ResizeObserver(()=>{if(lastM)draw(lastM,lastL)}).observe(document.querySelector(".chart"));
try{if(innerHeight>=1000&&innerWidth>900)document.querySelector("details").open=true}catch(e){}
sync();render();
</script>
</body>
